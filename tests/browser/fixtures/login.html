<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #fff; color: #111; }
        h1 { font-size: 24px; margin: 0 0 20px; }
        label { display: block; font-size: 14px; margin: 0 0 4px; }
        input { display: block; margin: 0 0 12px; padding: 6px; font-size: 14px; border: 1px solid #ccc; width: 200px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        #message { margin-top: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <h1 data-testid="heading">Login</h1>
    <form id="login-form">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" data-testid="email-input">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" data-testid="password-input">
        <button type="submit" data-testid="submit-btn">Sign In</button>
    </form>
    <div id="message" data-testid="message"></div>
    <script>
        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            if (email === "alice@test.com" && password === "secret") {
                document.getElementById("message").textContent = "Welcome, alice@test.com!";
            } else {
                document.getElementById("message").textContent = "Invalid credentials.";
            }
        });
    </script>
</body>
</html>
